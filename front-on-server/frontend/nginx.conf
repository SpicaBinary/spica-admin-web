server {
    # 监听80端口，HTTP默认端口
    listen 80;
    
    # 设置服务器名称，_ 表示匹配任意域名
    server_name _;

    # 设置网站根目录位置
    root /usr/share/nginx/html;
    
    # 设置默认首页文件
    index index.html;

    # 处理前端路由，对于单页应用(SPA)很重要
    location / {
        # 尝试按顺序查找文件，如果都不存在则重定向到index.html
        try_files $uri $uri/ /index.html;
    }

    # API请求代理配置，将/api/开头的请求转发到后端服务
    location ^~ /api {
        # 将请求代理到网关服务
        proxy_pass http://gateway:8080;
        # 设置Host头为原始请求的主机名
        proxy_set_header Host $host;
        # 设置X-Real-IP头为客户端真实IP地址
        proxy_set_header X-Real-IP $remote_addr;
        # 设置X-Forwarded-For头为代理服务器的IP地址
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 设置X-Forwarded-Proto头为当前请求的协议
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}